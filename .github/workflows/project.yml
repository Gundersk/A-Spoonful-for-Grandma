name: Project checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm run check
      - run: npm test
      - name: Documentation changed with implementation
        run: npm run docs:check
      - name: Verify clean package
        run: python tools/packaging/package.py --version ci-candidate
